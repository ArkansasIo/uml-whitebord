name: AI Runtime Checks
on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'brain/**'
      - 'brainscript/**'
      - 'verification/**'
      - 'memory/**'
      - 'agents/**'
      - 'tests/**'
      - 'schemas/**'
      - 'package.json'
      - '.github/workflows/ai-runtime.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'brain/**'
      - 'brainscript/**'
      - 'verification/**'
      - 'memory/**'
      - 'agents/**'
      - 'tests/**'
      - 'schemas/**'
      - 'package.json'
      - '.github/workflows/ai-runtime.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
