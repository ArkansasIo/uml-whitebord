name: MLTA UML Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "uml-studio/**"
      - ".github/workflows/mlta-uml-studio.yml"
  pull_request:
    paths:
      - "uml-studio/**"
      - ".github/workflows/mlta-uml-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mlta-uml-studio-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check uml-studio/app.js
      - name: Check required static files
        run: test -s uml-studio/index.html && test -s uml-studio/styles.css && test -s uml-studio/app.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uml-studio
      - id: deployment
        uses: actions/deploy-pages@v4
