name: MLTA UML Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "uml-studio/**"
      - ".github/workflows/mlta-uml-studio.yml"
  pull_request:
    paths:
      - "uml-studio/**"
      - ".github/workflows/mlta-uml-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mlta-uml-studio-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in blueprint-system.js uml-systems.js project-store.js diagram-model.js app.js workspace-shell.js binder-panels.js workbench-data.js verification.js binder-services.js ollama-adapter.js brain-adapter.js brainscript-engine.js command-palette.js workbench.js feature-tools.js agent-chat.js agent-chat-ui.js; do node --check "uml-studio/$f"; done
      - name: Check required static files
        run: |
          for f in index.html styles.css blueprint-system.js blueprint.schema.json uml-systems.js project-store.js diagram-model.js binder-panels.css command-palette.css workbench.css agent-chat.css app.js workspace-shell.js binder-panels.js workbench-data.js verification.js binder-services.js ollama-adapter.js brain-adapter.js brainscript-engine.js command-palette.js workbench.js feature-tools.js agent-chat.js agent-chat-ui.js; do test -s "uml-studio/$f"; done
      - name: Check script and style references
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html=readFileSync('uml-studio/index.html','utf8');
          const required=['blueprint-system.js','uml-systems.js','project-store.js','diagram-model.js','workspace-shell.js','app.js','binder-panels.js','workbench-data.js','verification.js','binder-services.js','ollama-adapter.js','brain-adapter.js','brainscript-engine.js','command-palette.js','workbench.js','feature-tools.js','agent-chat.js','agent-chat-ui.js','binder-panels.css','command-palette.css','workbench.css','agent-chat.css'];
          const missing=required.filter(x=>!html.includes(x));
          if(missing.length)throw new Error('Missing asset references: '+missing.join(', '));
          console.log(`Validated ${required.length} Binder IDE references.`);
          NODE
      - name: Validate AI runtime contracts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const checks=[['uml-studio/uml-systems.js',['MLTAUMLSystems','validateModel','interaction-overview']],['uml-studio/project-store.js',['MLTAUMLProjectStore','exportProject','importProject']],['uml-studio/blueprint-system.js',['MLTAUMLBlueprintSystem','validate','applyBlueprint']],['uml-studio/diagram-model.js',['validateDiagram','normalizeDiagram','NODE_LIMIT_EXCEEDED']],['uml-studio/verification.js',['validateScript','AIBinderVerification']],['uml-studio/brainscript-engine.js',['parse','execute','AIBinderBrainScript']],['uml-studio/ollama-adapter.js',['generate','ping','AIBinderOllama']],['uml-studio/brain-adapter.js',['AIBinderBrain']],['uml-studio/agent-chat.js',['AIBinderAgent','inspect_diagram','validate_diagram']],['uml-studio/agent-chat-ui.js',['agentLaunch','agentInput','agentSend']]];
          for(const [file,tokens] of checks){const text=readFileSync(file,'utf8');for(const token of tokens)if(!text.includes(token))throw new Error(`${file}: missing ${token}`)}
          console.log('AI runtime contracts present.');
          NODE
      - name: Run repository tests\n        run: npm test\n      - name: Check required element IDs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html=readFileSync('uml-studio/index.html','utf8'),js=readFileSync('uml-studio/app.js','utf8');
          const ids=[...js.matchAll(/\$\("([A-Za-z][A-Za-z0-9_-]*)"\)/g)].map(m=>m[1]);
          const missing=[...new Set(ids)].filter(id=>!html.includes('id="'+id+'"')&&!html.includes("id='"+id+"'"));
          if(missing.length)throw new Error('Missing HTML IDs: '+missing.join(', '));
          console.log(`Validated ${new Set(ids).size} referenced UI IDs.`);
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: uml-studio
      - id: deployment
        uses: actions/deploy-pages@v4
